<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnaccLeela - Wiki Viewer</title>
    
    <!-- Unified Icon Engine for consistency -->
    <script src="../assets/js/icon-engine.js" defer></script>
    
    <!-- Load custom cursor for the wrapper itself -->
    <script src="../assets/js/vine-cursor.js" defer></script>
    <!-- Load unified font engine -->
    <link rel="stylesheet" href="../assets/css/fonts.css">
    
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; 
            background-color: var(--wood-dark, #1d3d2f);
            cursor: none; 
        }
        
        :root {
            --season-bg: #fdfbf7;
            --season-text: #1d3d2f;
        }

        iframe { 
            width: 100vw; 
            height: 100vh; 
            border: none; 
            display: block; 
            cursor: none;
        }

        /* Loading overlay to mask the transition */
        #loading {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #fce4ec 0%, #c8e6c9 33%, #ffe082 66%, #e0f7fa 100%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.7s ease, clip-path 0.8s cubic-bezier(0.77, 0, 0.175, 1);
            clip-path: circle(150% at 50% 50%);
            color: #1d3d2f;
            font-family: 'Fondamento', serif;
            font-size: 1.8rem;
            font-weight: normal;
            text-align: center;
            letter-spacing: 0.5px;
        }

        #loader-text {
            animation: text-pulse 2s ease-in-out infinite;
        }

        @keyframes text-pulse {
            0%, 100% { opacity: 0.7; }
            50% { opacity: 1; text-shadow: 0 0 10px currentColor; }
        }

        /* Polished 3D Book Turn Animation (Fallback) */
        .paper-flip {
            width: 60px;
            height: 75px;
            position: relative;
            perspective: 800px;
            margin-bottom: 30px;
            transform: translateX(30px) rotateX(20deg) rotateY(-20deg);
            transform-style: preserve-3d;
        }
        .paper-page {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0; left: 0;
            background: currentColor;
            border-radius: 3px;
            transform-origin: left center;
            animation: polished-turn 2.4s cubic-bezier(0.645, 0.045, 0.355, 1) infinite;
            opacity: 0;
        }
        .paper-page:nth-child(1) { animation-delay: 0s; }
        .paper-page:nth-child(2) { animation-delay: 0.8s; }
        .paper-page:nth-child(3) { animation-delay: 1.6s; }

        @keyframes polished-turn {
            0% { 
                transform: rotateY(0deg) translateZ(1px); 
                opacity: 0; 
                box-shadow: 2px 2px 5px rgba(0,0,0,0);
            }
            20% { 
                opacity: 0.9; 
                box-shadow: 2px 2px 10px rgba(0,0,0,0.2);
            }
            80% { 
                opacity: 0.9; 
            }
            100% { 
                transform: rotateY(-179deg) translateZ(1px); 
                opacity: 0; 
                box-shadow: -2px 2px 10px rgba(0,0,0,0.2);
            }
        }

        #loader-gif {
            width: 120px;
            height: 120px;
            object-fit: contain;
            image-rendering: pixelated;
        }
    </style>
</head>
<body data-favicon="loader" data-favicon-color="#8d6e63">

    <div id="loading">
        <!-- Main GIF loader, falls back to CSS flip if GIF doesn't exist -->
        <img id="loader-gif" style="display: none;" onerror="this.style.display='none'; document.getElementById('css-fallback-loader').style.display='block';" alt="" />
        
        <div id="css-fallback-loader" class="paper-flip" style="display: none;">
            <div class="paper-page"></div>
            <div class="paper-page"></div>
            <div class="paper-page"></div>
        </div>
        
        <div id="loader-text">Journeying through the seasons...</div>
    </div>
    <iframe id="wiki-frame" title="Wiki Content"></iframe>

    <script>
        const params = new URLSearchParams(window.location.search);
        let path = params.get('wiki');
        
        // Custom Themes and GIF setup for the loader
        const loaderContainer = document.getElementById('loading');
        const loaderText = document.getElementById('loader-text');
        const loaderGif = document.getElementById('loader-gif');

        // Extract a friendly name from the path for the default theme
        let fallbackName = "the Wiki";
        if (path) {
            const parts = path.split('/');
            const filename = parts[parts.length - 1];
            fallbackName = filename.replace('.html', '').replace(/-/g, ' ');
        }

        let targetFavicon = 'feather';
        let targetFaviconColor = '#8d6e63';

        if (path && path.includes('Hazelbite')) {
            targetFavicon = 'visitblog';
            targetFaviconColor = '#ff69b4';
        } else if (path && path.includes('Project-Cannon')) {
            targetFavicon = 'cannon';
            targetFaviconColor = '#ff9800';
        }

        // Central Theme: Combining All Seasons (Spring -> Summer -> Autumn -> Winter)
        loaderContainer.style.background = 'linear-gradient(135deg, #fce4ec 0%, #c8e6c9 33%, #ffe082 66%, #e0f7fa 100%)'; 
        loaderContainer.style.color = '#1d3d2f'; 
        document.documentElement.style.setProperty('--season-bg', '#fdfbf7');
        document.documentElement.style.setProperty('--season-text', '#1d3d2f');
        loaderText.textContent = "Journeying through the seasons...";
        
        if (loaderGif) {
            loaderGif.style.display = 'block';
            loaderGif.src = "../assets/images/default-loader.gif";
        }

        if (path) {
            // Append hash if present so TiddlyWiki opens the correct tiddler
            if (window.location.hash) {
                path += window.location.hash;
            }
            
            const iframe = document.getElementById('wiki-frame');
            
            iframe.onload = () => {
                // Use sessionStorage to only show the slow aesthetic load once per session
                const hasLoadedBefore = sessionStorage.getItem('wiki_aesthetic_shown');
                const delay = hasLoadedBefore ? 400 : 3500;
                sessionStorage.setItem('wiki_aesthetic_shown', 'true');

                setTimeout(() => {
                    const loader = document.getElementById('loading');
                    if (loader) {
                        loader.style.pointerEvents = 'none';
                        loader.style.opacity = '0';
                        loader.style.clipPath = 'circle(0% at 50% 50%)';
                        setTimeout(() => loader.remove(), 800);
                    }

                    // Switch favicon from loader to the actual target icon
                    document.body.setAttribute('data-favicon', targetFavicon);
                    document.body.setAttribute('data-favicon-color', targetFaviconColor);
                    if (window.setSystemFavicon) {
                        window.setSystemFavicon(targetFavicon, targetFaviconColor);
                    }
                }, delay);

                try {
                    const doc = iframe.contentDocument || iframe.contentWindow.document;
                    
                    // Inject cursor script into iframe
                    const script = doc.createElement('script');
                    // Compute depth to assets folder based on the path
                    // Assuming path is like "blog/Hazelbite.html" -> depth is 1
                    // So script.src = "../../assets/js/vine-cursor.js"
                    const depth = (path.match(/\//g) || []).length;
                    let prefix = "";
                    for(let i=0; i<=depth; i++) prefix += "../";
                    script.src = prefix + "assets/js/vine-cursor.js";
                    doc.head.appendChild(script);

                    // Forward hover state styling since iframe body might have default cursor
                    const style = doc.createElement('style');
                    style.textContent = `
                        * { cursor: none !important; }
                    `;
                    doc.head.appendChild(style);

                    // Intercept clicks on links to elegantly handle redirects outside the wiki
                    doc.addEventListener('click', (e) => {
                        const a = e.target.closest('a');
                        if (a && a.href) {
                            // Only intercept actual page navigation, ignore internal hashes
                            const url = new URL(a.href, doc.baseURI);
                            // If it's pointing to another HTML page on our site (or external)
                            if (url.pathname.endsWith('.html') && url.pathname !== new URL(iframe.src).pathname) {
                                e.preventDefault();
                                
                                const isCorePage = url.pathname.endsWith('/home.html') || 
                                                   url.pathname.endsWith('/about.html') || 
                                                   url.pathname.endsWith('/index.html') || 
                                                   url.pathname.endsWith('/backend.html') ||
                                                   url.pathname.endsWith('/wiki-viewer.html') ||
                                                   url.pathname.endsWith('/nonbinary-transfem.html');
                                                   
                                let targetUrl = url.href;
                                if (!isCorePage && url.pathname.includes('/pages/')) {
                                    // It's a link to another TiddlyWiki! Re-wrap it in the viewer
                                    const pagesIndex = url.pathname.indexOf('/pages/');
                                    const wikiPath = url.pathname.substring(pagesIndex + 7);
                                    targetUrl = './wiki-viewer.html?wiki=' + wikiPath;
                                }

                                // Create a polished, dynamic transition overlay
                                const overlay = document.createElement('div');
                                overlay.style.position = 'fixed';
                                overlay.style.top = '0';
                                overlay.style.left = '0';
                                overlay.style.width = '100%';
                                overlay.style.height = '100%';
                                overlay.style.background = loaderContainer ? loaderContainer.style.background : '#1d3d2f';
                                overlay.style.zIndex = '100000';
                                overlay.style.clipPath = 'circle(0% at 50% 50%)';
                                overlay.style.transition = 'clip-path 0.7s cubic-bezier(0.77, 0, 0.175, 1)';
                                overlay.style.display = 'flex';
                                overlay.style.alignItems = 'center';
                                overlay.style.justifyContent = 'center';

                                const overlayText = document.createElement('div');
                                overlayText.textContent = "Journeying through the seasons...";
                                overlayText.style.fontFamily = "'Fondamento', serif";
                                overlayText.style.fontSize = '1.8rem';
                                overlayText.style.color = loaderContainer ? loaderContainer.style.color : '#fff';
                                overlayText.style.animation = 'text-pulse 1.5s ease-in-out infinite';
                                overlay.appendChild(overlayText);
                                
                                document.body.appendChild(overlay);
                                
                                // Force reflow
                                void overlay.offsetWidth;
                                
                                // Expand the circle to cover the screen
                                overlay.style.clipPath = 'circle(150% at 50% 50%)';
                                
                                setTimeout(() => {
                                    window.top.location.href = targetUrl;
                                }, 700);
                            } else if (a.getAttribute('target') === '_blank') {
                                // For external links forced to blank, just let them open (or force top)
                            }
                        }
                    }, true); // Use capture phase to intercept before TiddlyWiki

                    // Sync hashes from iframe to wrapper
                    iframe.contentWindow.addEventListener('hashchange', () => {
                        window.history.replaceState(null, null, '#' + iframe.contentWindow.location.hash.substring(1));
                    });
                } catch (e) {
                    console.log("Cannot inject script into iframe due to cross-origin restrictions (run via local server to see cursor inside wiki).", e);
                }
            };
            
            iframe.src = path;
        } else {
            document.getElementById('loading').textContent = "No Wiki specified!";
        }
        
        // Sync hashes from wrapper to iframe
        window.addEventListener('hashchange', () => {
            const iframe = document.getElementById('wiki-frame');
            if(iframe && iframe.contentWindow) {
                iframe.contentWindow.location.hash = window.location.hash;
            }
        });
    </script>
</body>
</html>
