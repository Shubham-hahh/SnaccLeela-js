<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../assets/js/seo.js"></script>
    <script src="../assets/js/vine-cursor.js" defer></script>
    <script src="../assets/js/icon-engine.js" defer></script>
    <title>Backend System - Licenses</title>
    
    <link rel="stylesheet" href="../assets/css/fonts.css">
    <style>
        :root {
            /* Bubblegum Pink Retro Palette */
            --bg-color: #1a000d; 
            --term-mauve: #ffb6c1; 
            --term-glow: rgba(255, 182, 193, 0.6);
            --term-hot-pink: #ff69b4;
            --term-dim: rgba(255, 182, 193, 0.4);
            --glitch-cyan: rgba(0, 255, 242, 0.5);
            --glitch-pink: rgba(255, 20, 147, 0.6);
            --license-separator: rgba(255, 105, 180, 0.35);
            --font-stack: 'Sixtyfour', 'Courier New', monospace;
            --font-body: 'Courier New', 'Consolas', monospace;
            --cursor-size: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none; 
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: var(--bg-color);
            color: var(--term-mauve);
            font-family: var(--font-stack);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- CRT Effects --- */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 100;
        }

        .screen-flicker {
            animation: flicker 0.15s infinite;
            pointer-events: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 182, 193, 0.02);
            z-index: 99;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            50% { opacity: 0.85; }
            100% { opacity: 0.95; }
        }

        /* --- Loader --- */
        #loader {
            position: absolute;
            font-size: 1.5rem;
            text-shadow: 0 0 10px var(--term-glow);
            z-index: 50;
            white-space: pre;
        }

        .loader-log {
            display: block;
            font-size: 0.65rem;
            color: var(--term-dim);
            text-shadow: none;
            margin-top: 4px;
            font-family: var(--font-body);
            opacity: 0;
            animation: logFadeIn 0.3s forwards;
        }

        @keyframes logFadeIn {
            to { opacity: 1; }
        }

        /* --- Layout --- */
        #main-content {
            display: none;
            width: 90%;
            height: 90%;
            border: 2px solid var(--term-mauve);
            padding: 20px;
            box-shadow: inset 0 0 20px var(--term-glow), 0 0 20px var(--term-glow);
            flex-direction: column;
            position: relative;
            z-index: 10;
            animation: bootIn 0.4s ease-out;
        }

        @keyframes bootIn {
            from { opacity: 0; transform: scale(0.98); }
            to { opacity: 1; transform: scale(1); }
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed var(--term-mauve);
            padding-bottom: 10px;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        header h1 {
            font-size: 1.2rem;
            text-shadow: 2px 2px var(--glitch-pink);
        }

        .btn {
            background: transparent;
            color: var(--term-mauve);
            border: 1px solid var(--term-mauve);
            padding: 8px 15px;
            font-family: inherit;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover, .btn.active {
            background: var(--term-mauve);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--term-glow);
        }

        .btn i {
            width: 16px;
            height: 16px;
        }

        /* --- Sidebar --- */
        #content-area {
            display: flex;
            flex: 1;
            gap: 20px;
            overflow: hidden;
            min-height: 0;
        }

        #sidebar {
            flex: 0 0 260px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border-right: 1px solid rgba(255, 182, 193, 0.3);
            padding-right: 15px;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: var(--term-dim) transparent;
        }

        #sidebar::-webkit-scrollbar { width: 4px; }
        #sidebar::-webkit-scrollbar-thumb { background-color: var(--term-dim); }

        .sidebar-label {
            font-size: 0.5rem;
            color: var(--term-dim);
            text-transform: uppercase;
            letter-spacing: 2px;
            padding: 8px 0 4px 4px;
            border-top: 1px dashed rgba(255, 182, 193, 0.15);
            margin-top: 4px;
            font-family: var(--font-body);
        }

        .sidebar-label:first-child {
            border-top: none;
            margin-top: 0;
        }

        .font-sub-menu {
            display: none;
            flex-direction: column;
            gap: 4px;
            padding-left: 12px;
            border-left: 2px solid rgba(255, 105, 180, 0.25);
            margin-left: 8px;
        }

        .font-sub-menu.open {
            display: flex;
        }

        .font-sub-btn {
            font-size: 0.6rem;
            padding: 5px 10px;
            border-color: rgba(255, 182, 193, 0.4);
            font-family: var(--font-body);
            text-transform: none;
        }

        .font-sub-btn:hover, .font-sub-btn.active {
            border-color: var(--term-hot-pink);
        }

        .nav-btn {
            flex-shrink: 0;
        }

        /* --- Viewer --- */
        #viewer {
            flex: 1;
            overflow-y: auto;
            padding: 0;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 182, 193, 0.2);
            line-height: 1.6;
            font-size: 0.85rem;
            scrollbar-width: thin;
            scrollbar-color: var(--term-mauve) transparent;
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        #viewer::-webkit-scrollbar { width: 8px; }
        #viewer::-webkit-scrollbar-thumb { background-color: var(--term-mauve); border-radius: 4px; }
        #viewer::-webkit-scrollbar-track { background: rgba(255, 182, 193, 0.05); }

        .viewer-header {
            text-align: center;
            padding: 16px 20px;
            border-bottom: 1px dashed rgba(255, 182, 193, 0.3);
            color: var(--term-hot-pink);
            text-shadow: 0 0 5px var(--term-hot-pink);
            flex-shrink: 0;
            background: rgba(255, 20, 147, 0.04);
        }

        .viewer-header h2 {
            font-size: 0.9rem;
        }

        .viewer-header p {
            font-size: 0.55rem;
            color: var(--term-dim);
            margin-top: 4px;
            font-family: var(--font-body);
        }

        #license-text {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
            font-family: var(--font-body);
            min-height: 0;
        }

        /* --- Parsed Content Styles --- */
        #license-text h1 {
            color: var(--term-hot-pink);
            font-size: 1rem;
            margin: 20px 0 10px;
            text-shadow: 0 0 8px rgba(255, 105, 180, 0.4);
            font-family: var(--font-stack);
            border-bottom: 1px solid rgba(255, 105, 180, 0.2);
            padding-bottom: 6px;
        }

        #license-text h2 {
            color: var(--term-hot-pink);
            font-size: 0.9rem;
            margin: 18px 0 8px;
            text-shadow: 0 0 6px rgba(255, 105, 180, 0.3);
            font-family: var(--font-stack);
        }

        #license-text h3 {
            color: #ffaec9;
            font-size: 0.85rem;
            margin: 14px 0 6px;
            font-family: var(--font-stack);
        }

        #license-text strong {
            color: #fff;
            text-shadow: 0 0 3px var(--term-glow);
        }

        #license-text em {
            color: #ffc8d6;
            font-style: italic;
        }

        #license-text a {
            color: var(--term-hot-pink);
            text-decoration: underline;
            text-decoration-style: dashed;
            text-underline-offset: 3px;
            transition: color 0.2s, text-shadow 0.2s;
        }

        #license-text a:hover {
            color: #fff;
            text-shadow: 0 0 8px var(--term-glow);
        }

        #license-text p {
            margin: 8px 0;
        }

        #license-text .license-block {
            margin: 0 0 4px;
            line-height: 1.7;
        }

        #license-text ul {
            list-style: none;
            padding-left: 16px;
            margin: 6px 0;
        }

        #license-text ul li {
            position: relative;
            padding-left: 16px;
            margin: 4px 0;
        }

        #license-text ul li::before {
            content: '▸';
            position: absolute;
            left: 0;
            color: var(--term-hot-pink);
        }

        #license-text ol {
            list-style: none;
            counter-reset: section;
            padding-left: 8px;
            margin: 8px 0;
        }

        #license-text ol li {
            counter-increment: section;
            padding-left: 24px;
            position: relative;
            margin: 6px 0;
        }

        #license-text ol li::before {
            content: counter(section) '.';
            position: absolute;
            left: 0;
            color: var(--term-hot-pink);
            font-weight: bold;
        }

        #license-text .indent-block {
            padding-left: 24px;
            border-left: 2px solid rgba(255, 105, 180, 0.2);
            margin: 6px 0;
            color: rgba(255, 182, 193, 0.85);
        }

        #license-text .section-title {
            color: var(--term-hot-pink);
            font-weight: bold;
            font-size: 0.85rem;
            margin: 16px 0 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 0 0 4px rgba(255, 105, 180, 0.3);
        }

        /* --- License Separator (for multi-licensee files) --- */
        .license-divider {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 28px 0;
            padding: 12px 0;
        }

        .license-divider::before,
        .license-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--license-separator), transparent);
        }

        .license-divider-tag {
            font-size: 0.55rem;
            color: var(--term-hot-pink);
            text-transform: uppercase;
            letter-spacing: 3px;
            font-family: var(--font-stack);
            text-shadow: 0 0 6px rgba(255, 105, 180, 0.4);
            white-space: nowrap;
            padding: 4px 12px;
            border: 1px dashed var(--license-separator);
        }

        /* --- Fetch Animation --- */
        .fetch-status {
            text-align: center;
            padding: 40px 20px;
            font-family: var(--font-body);
        }

        .fetch-status .spinner {
            display: inline-block;
            animation: spin 0.6s linear infinite;
            font-size: 1.2rem;
            margin-bottom: 12px;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .fetch-status .path {
            font-size: 0.65rem;
            color: var(--term-dim);
            word-break: break-all;
            margin-top: 8px;
        }

        /* --- Error State --- */
        .error-display {
            text-align: center;
            padding: 40px 20px;
        }

        .error-display .error-code {
            font-size: 1.5rem;
            color: #ff4466;
            text-shadow: 0 0 10px rgba(255, 68, 102, 0.5);
            font-family: var(--font-stack);
            margin-bottom: 12px;
        }

        .error-display .error-msg {
            font-family: var(--font-body);
            font-size: 0.75rem;
            color: var(--term-dim);
            line-height: 1.8;
        }

        /* --- Idle State --- */
        .idle-prompt {
            text-align: center;
            padding: 60px 20px;
            font-family: var(--font-body);
        }

        .idle-prompt .prompt-icon {
            font-size: 2rem;
            margin-bottom: 16px;
            opacity: 0.5;
        }

        .idle-prompt .prompt-text {
            font-size: 0.7rem;
            color: var(--term-dim);
            line-height: 1.8;
        }

        .idle-prompt .prompt-cursor {
            display: inline-block;
            width: 8px;
            height: 14px;
            background: var(--term-mauve);
            margin-left: 4px;
            animation: blink 1s step-end infinite;
            vertical-align: middle;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        /* --- Content appear animation --- */
        .content-appear {
            animation: contentReveal 0.3s ease-out;
        }

        @keyframes contentReveal {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Font name badge --- */
        .font-badge {
            display: inline-block;
            font-size: 0.5rem;
            padding: 2px 8px;
            border: 1px solid var(--term-dim);
            color: var(--term-dim);
            border-radius: 2px;
            margin-left: 6px;
            vertical-align: middle;
            font-family: var(--font-body);
        }

        /* --- Clickable header --- */
        .viewer-header.clickable {
            cursor: none;
            transition: background 0.2s, border-color 0.2s;
        }

        .viewer-header.clickable:hover {
            background: rgba(255, 20, 147, 0.1);
            border-bottom-color: var(--term-hot-pink);
        }

        .viewer-header .header-hint {
            font-size: 0.45rem;
            color: rgba(255, 182, 193, 0.25);
            margin-top: 6px;
            font-family: var(--font-body);
            letter-spacing: 1px;
            transition: color 0.2s;
        }

        .viewer-header.clickable:hover .header-hint {
            color: var(--term-dim);
        }

        /* --- Core license sidebar button --- */
        .core-btn {
            border-color: var(--term-hot-pink);
            color: var(--term-hot-pink);
            position: relative;
        }

        .core-btn::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(255, 105, 180, 0.05);
            pointer-events: none;
        }

        .core-btn:hover, .core-btn.active {
            background: var(--term-hot-pink);
            color: var(--bg-color);
        }
    </style>
</head>

    <script>
        // --- Boot Sequence ---
        const loader = document.getElementById('loader');
        const mainContent = document.getElementById('main-content');
        const frames = ['/', '-', '\\', '|'];
        let frameIdx = 0;

        const bootLogs = [
            '[OK] kernel.legal_module loaded',
            '[OK] license_db mounted at /legal',
            '[OK] font_registry: 12 families indexed',
            '[OK] icon_engine: ISC/MIT dual verified',
            '[OK] audio_cc0: public domain confirmed',
            '[  ] booting terminal interface...',
        ];

        let logIdx = 0;
        const loadingInterval = setInterval(() => {
            loader.querySelector('.boot-spinner').textContent = `BOOTING SYSTEM... ${frames[frameIdx]}`;
            frameIdx = (frameIdx + 1) % frames.length;
        }, 150);

        const logInterval = setInterval(() => {
            if (logIdx < bootLogs.length) {
                const logLine = document.createElement('span');
                logLine.className = 'loader-log';
                logLine.textContent = bootLogs[logIdx];
                loader.appendChild(logLine);
                logIdx++;
            }
        }, 300);

        setTimeout(() => {
            clearInterval(loadingInterval);
            clearInterval(logInterval);
            loader.style.display = 'none';
            mainContent.style.display = 'flex';
            // Auto-load the core license on boot
            loadCoreLicense(document.getElementById('core-license-btn'));
        }, 2200);

        // --- Markdown/Text Parser ---
        function parseContent(text, filepath) {
            const isPlainText = filepath.endsWith('.txt');
            if (isPlainText) {
                return parsePlainText(text);
            }
            // Auto-detect: if a .md file has no markdown syntax, treat as plain text
            const hasMarkdown = /^#{1,3}\s/m.test(text) || /\*\*.+?\*\*/m.test(text) || /^- .+/m.test(text);
            if (!hasMarkdown) {
                return parsePlainText(text);
            }
            return parseMarkdown(text);
        }

        function parseMarkdown(raw) {
            // Split on --- horizontal rules to handle multi-licensee files
            const sections = raw.split(/\n---+\n/);
            
            if (sections.length > 1) {
                return sections.map((section, i) => {
                    const parsed = parseMarkdownSection(section.trim());
                    if (i < sections.length - 1) {
                        return parsed + 
                            '<div class="license-divider">' +
                            '<span class="license-divider-tag">§ next license §</span>' +
                            '</div>';
                    }
                    return parsed;
                }).join('');
            }
            
            return parseMarkdownSection(raw);
        }

        function parseMarkdownSection(text) {
            let html = escapeHtml(text);
            
            // Headers (must come before other processing)
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');
            
            // Bold (non-greedy)
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
            
            // Italic (non-greedy, but not matching ** which was already consumed)
            html = html.replace(/(?<!\*)\*([^*]+?)\*(?!\*)/g, '<em>$1</em>');
            
            // URLs - auto-link bare URLs
            html = html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
            
            // Unordered list items
            html = html.replace(/^- (.+)$/gm, '<ul><li>$1</li></ul>');
            // Merge adjacent <ul> tags
            html = html.replace(/<\/ul>\s*<ul>/g, '');
            
            // Numbered list items (digit followed by . or ))
            html = html.replace(/^(\d+)[.)]\s+(.+)$/gm, '<ol><li>$2</li></ol>');
            html = html.replace(/<\/ol>\s*<ol>/g, '');
            
            // Indented lines (4+ spaces or tab) — treat as indent block
            html = html.replace(/^(?:    |\t)(.+)$/gm, '<div class="indent-block">$1</div>');
            // Merge adjacent indent blocks
            html = html.replace(/<\/div>\s*<div class="indent-block">/g, '<br>');
            
            // Paragraphs — double newlines
            html = html.replace(/\n\n+/g, '</p><p>');
            
            // Single newlines within paragraphs
            html = html.replace(/\n/g, '<br>');
            
            // Wrap in paragraph
            html = '<div class="license-block"><p>' + html + '</p></div>';
            
            // Clean up empty paragraphs
            html = html.replace(/<p>\s*<\/p>/g, '');
            
            return html;
        }

        function parsePlainText(text) {
            let html = escapeHtml(text);
            
            // Detect section headers (ALL CAPS lines that are short-ish, like PREAMBLE, DEFINITIONS, TERMINATION, etc.)
            html = html.replace(/^([A-Z][A-Z &:]{2,60})$/gm, '<div class="section-title">$1</div>');
            
            // Detect centered title lines (lots of leading whitespace)
            html = html.replace(/^ {10,}(.+)$/gm, '<div style="text-align:center;color:var(--term-hot-pink);margin:4px 0;">$1</div>');
            
            // Detect "--- ... ---" separator lines
            html = html.replace(/^-{3,}.*?-{3,}$/gm, function(match) {
                const inner = match.replace(/-/g, '').trim();
                if (inner) {
                    return '<div class="license-divider"><span class="license-divider-tag">' + inner + '</span></div>';
                }
                return '<div class="license-divider"><span class="license-divider-tag">§</span></div>';
            });
            // Also catch standalone --- lines
            html = html.replace(/^-{3,}$/gm, '<div class="license-divider"><span class="license-divider-tag">§</span></div>');
            
            // Copyright lines — highlight
            html = html.replace(/^(Copyright .+)$/gm, '<strong>$1</strong>');
            // Also catch indented copyright
            html = html.replace(/^ +(Copyright .+)$/gm, '<strong>$1</strong>');
            
            // URLs
            html = html.replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
            
            // Numbered sections like "   1. Title." or "   9. Title"
            html = html.replace(/^ {2,6}(\d+)\.\s+(.+)$/gm, '<br><strong style="color:var(--term-hot-pink)">$1.</strong> $2');
            
            // Sub-items like "      (a) Text" or "      (d) Text"
            html = html.replace(/^ {4,}(\([a-z]\))\s+/gm, '<br><span style="color:var(--term-hot-pink);padding-left:16px;">$1</span> ');
            
            // Numbered items like 1), 2), etc. (OFL style)
            html = html.replace(/^(\d+)\)\s+/gm, '<br><strong style="color:var(--term-hot-pink)">$1)</strong> ');
            
            // "END OF ..." lines
            html = html.replace(/^ *(END OF .+)$/gm, '<div class="section-title" style="margin-top:24px;">$1</div>');
            
            // "APPENDIX:" lines
            html = html.replace(/^ *(APPENDIX:.+)$/gm, '<div class="section-title">$1</div>');
            
            // Double newlines = paragraph break
            html = html.replace(/\n\n+/g, '</p><p>');
            
            // Single newlines
            html = html.replace(/\n/g, '<br>');
            
            html = '<div class="license-block"><p>' + html + '</p></div>';
            html = html.replace(/<p>\s*<\/p>/g, '');
            
            return html;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // --- Fetch License ---
        async function loadText(filepath, btnElement) {
            const viewer = document.getElementById('license-text');
            const clickSound = document.getElementById('click-sound');
            
            // Handle active buttons
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.font-sub-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.icon-sub-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            playClick(clickSound);

            // Show fetch animation
            const shortPath = filepath.replace(/\.\.\//g, '');
            viewer.innerHTML = 
                '<div class="fetch-status">' +
                    '<div class="spinner">◐</div>' +
                    '<div>FETCHING LICENSE DATA...</div>' +
                    '<div class="path">' + shortPath + '</div>' +
                '</div>';

            try {
                const response = await fetch(filepath);
                if (!response.ok) throw new Error('File not found or access denied.');
                const text = await response.text();
                
                setTimeout(() => {
                    viewer.innerHTML = '<div class="content-appear">' + parseContent(text, filepath) + '</div>';
                }, 250);

            } catch (error) {
                viewer.innerHTML = 
                    '<div class="error-display">' +
                        '<div class="error-code">[ERR 404]</div>' +
                        '<div class="error-msg">' +
                            'UNABLE TO LOCATE FILE<br>' +
                            '<span style="color:var(--term-hot-pink)">' + shortPath + '</span><br><br>' +
                            'Verify file paths exist in /legal directory.' +
                        '</div>' +
                    '</div>';
            }
        }

        // --- Core License ---
        function loadCoreLicense(btnElement) {
            // Mark sidebar buttons
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.font-sub-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.icon-sub-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            loadText('../LICENSE.md', null);
        }

        // --- Icon Sub-menu ---
        function toggleIconMenu(btnElement) {
            const menu = document.getElementById('icon-sub-menu');
            const isOpen = menu.classList.contains('open');
            menu.classList.toggle('open');
            
            const text = btnElement.childNodes[btnElement.childNodes.length - 1];
            if (text && text.nodeType === Node.TEXT_NODE) {
                text.textContent = isOpen ? ' Icons ▾' : ' Icons ▴';
            }

            playClick(document.getElementById('click-sound'));
        }

        function loadIcon(filepath, btnElement) {
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('icons-toggle').classList.add('active');
            
            document.querySelectorAll('.icon-sub-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.font-sub-btn:not(.icon-sub-btn)').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            loadText(filepath, null);
        }

        // --- Font Sub-menu ---
        function toggleFontMenu(btnElement) {
            const menu = document.getElementById('font-sub-menu');
            const isOpen = menu.classList.contains('open');
            menu.classList.toggle('open');
            
            const text = btnElement.childNodes[btnElement.childNodes.length - 1];
            if (text && text.nodeType === Node.TEXT_NODE) {
                text.textContent = isOpen ? ' Fonts (OFL) ▾' : ' Fonts (OFL) ▴';
            }

            playClick(document.getElementById('click-sound'));
        }

        function loadFont(fontDir, btnElement) {
            const filepath = '../legal/google_fonts/' + fontDir + '/OFL.txt';
            
            // Mark the parent fonts button as active too
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('fonts-toggle').classList.add('active');
            
            // Mark font sub buttons
            document.querySelectorAll('.font-sub-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            loadText(filepath, null);
        }

        // --- Sound Helper ---
        function playClick(clickSound) {
            if (clickSound) {
                clickSound.currentTime = 0;
                const playPromise = clickSound.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => { /* Ignore auto-play blocking errors silently */ });
                }
            }
        }
    </script>

    <!-- Boot spinner element -->
    <script>
        // Inject the spinner text node into the loader
        const bootSpinner = document.createElement('span');
        bootSpinner.className = 'boot-spinner';
        bootSpinner.textContent = 'BOOTING SYSTEM... /';
        loader.textContent = '';
        loader.appendChild(bootSpinner);
    </script>
