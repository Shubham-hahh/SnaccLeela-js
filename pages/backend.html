<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend System - Licenses</title>
    
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    
    <script src="/assets/js/lucide.min.js"></script>

    <style>
        @font-face {
            font-family: 'Sixtyfour';
            src: url('/assets/fonts/backend/Sixtyfour-Regular-VariableFont.woff2') format('woff2');
            font-weight: 100 900;
            font-style: normal;
        }

        :root {
            /* Bubblegum Pink Retro Palette */
            --bg-color: #1a000d; 
            --term-mauve: #ffb6c1; 
            --term-glow: rgba(255, 182, 193, 0.6);
            --term-hot-pink: #ff69b4;
            --glitch-cyan: rgba(0, 255, 242, 0.5);
            --glitch-pink: rgba(255, 20, 147, 0.6);
            --font-stack: 'Sixtyfour', 'Courier New', monospace;
            --cursor-size: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            cursor: none; 
        }

        body, html {
            height: 100%;
            width: 100%;
            background-color: var(--bg-color);
            color: var(--term-mauve);
            font-family: var(--font-stack);
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- CRT Effects --- */
        .crt-overlay {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 100;
        }

        .screen-flicker {
            animation: flicker 0.15s infinite;
            pointer-events: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 182, 193, 0.02);
            z-index: 99;
        }

        @keyframes flicker {
            0% { opacity: 0.95; }
            50% { opacity: 0.85; }
            100% { opacity: 0.95; }
        }

        /* --- Custom Cursor (GPU Accelerated) --- */
        .custom-cursor {
            position: fixed;
            top: 0; 
            left: 0;
            width: var(--cursor-size);
            height: var(--cursor-size);
            border: 2px solid var(--term-hot-pink);
            background-color: rgba(255, 105, 180, 0.2);
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 8px var(--term-hot-pink);
            will-change: transform;
            transform: translate3d(-100px, -100px, 0); 
        }

        /* --- Layout --- */
        #loader {
            position: absolute;
            font-size: 1.5rem;
            text-shadow: 0 0 10px var(--term-glow);
            z-index: 50;
        }

        #main-content {
            display: none;
            width: 90%;
            height: 90%;
            border: 2px solid var(--term-mauve);
            padding: 20px;
            box-shadow: inset 0 0 20px var(--term-glow), 0 0 20px var(--term-glow);
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px dashed var(--term-mauve);
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 1.2rem;
            text-shadow: 2px 2px var(--glitch-pink);
        }

        .btn {
            background: transparent;
            color: var(--term-mauve);
            border: 1px solid var(--term-mauve);
            padding: 8px 15px;
            font-family: inherit;
            font-size: 0.8rem;
            text-transform: uppercase;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover, .btn.active {
            background: var(--term-mauve);
            color: var(--bg-color);
            box-shadow: 0 0 15px var(--term-glow);
        }

        .btn i {
            width: 16px;
            height: 16px;
        }

        /* --- License Area --- */
        #content-area {
            display: flex;
            flex: 1;
            gap: 20px;
            overflow: hidden;
        }

        #sidebar {
            flex: 0 0 250px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-right: 1px solid rgba(255, 182, 193, 0.3);
            padding-right: 15px;
            overflow-y: auto;
        }

        #viewer {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 182, 193, 0.2);
            line-height: 1.6;
            font-size: 0.85rem;
            scrollbar-width: thin;
            scrollbar-color: var(--term-mauve) transparent;
        }

        #viewer::-webkit-scrollbar {
            width: 8px;
        }
        #viewer::-webkit-scrollbar-thumb {
            background-color: var(--term-mauve);
        }

        .center-license {
            text-align: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px dashed rgba(255, 182, 193, 0.3);
            color: var(--term-hot-pink);
            text-shadow: 0 0 5px var(--term-hot-pink);
        }

        /* Parsed Markdown Styles */
        #license-text h1, #license-text h2, #license-text h3 {
            color: var(--term-hot-pink);
            margin-top: 15px;
            margin-bottom: 10px;
        }
        #license-text strong {
            color: #fff;
            text-shadow: 0 0 3px var(--term-glow);
        }
    </style>
</head>
<body>

    <div class="crt-overlay"></div>
    <div class="screen-flicker"></div>
    <div class="custom-cursor" id="cursor"></div>

    <div id="loader">BOOTING SYSTEM... /</div>

    <div id="main-content">
        <header>
            <h1>SYSTEM.LEGAL_BACKEND</h1>
            <button class="btn" id="back-btn" onclick="window.location.href='./home.html'">
                <i data-lucide="arrow-left-square"></i> RETURN
            </button>
        </header>

        <div id="content-area">
            <nav id="sidebar">
                <button class="btn nav-btn" onclick="loadText('/legal/music/CCO.md', this)">
                    <i data-lucide="music"></i> Audio (CC0)
                </button>
                <button class="btn nav-btn" onclick="loadText('/legal/icons/Apache.md', this)">
                    <i data-lucide="image"></i> Visuals (Apache)
                </button>
                <button class="btn nav-btn" onclick="loadText('/legal/icons/ICE.md', this)">
                    <i data-lucide="feather"></i> Lucide (ICE)
                </button>
                <button class="btn nav-btn" onclick="loadText('/legal/google_fonts/Nunito/OFL.txt', this)">
                    <i data-lucide="type"></i> Fonts (OFL)
                </button>
            </nav>

            <main id="viewer">
                <div class="center-license">
                    <h2>GNU AGPL v3</h2>
                    <p>CORE SYSTEM LICENSE</p>
                </div>
                <div id="license-text">
                    Select a module from the sidebar to verify licensing parameters...
                </div>
            </main>
        </div>
    </div>

    <audio id="click-sound" src="/assets/sounds/click.wav" preload="auto"></audio>

    <script>
        // --- 1. Initialize Main UI Icons ---
        lucide.createIcons();

        // --- 2. Dynamic Lucide Favicon Generator ---
        function setSystemFavicon(iconName, hexColor) {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = `<i data-lucide="${iconName}"></i>`;
            
            // Render the icon off-screen
            lucide.createIcons({ root: tempDiv });
            
            const svgElement = tempDiv.querySelector('svg');
            if (svgElement) {
                // Style it to match the theme
                svgElement.setAttribute('stroke', hexColor);
                svgElement.setAttribute('stroke-width', '2.5'); 
                
                // Convert to data URI
                const svgString = new XMLSerializer().serializeToString(svgElement);
                const encodedSvg = encodeURIComponent(svgString);
                
                // Inject into document head
                let link = document.querySelector("link[rel~='icon']");
                if (!link) {
                    link = document.createElement('link');
                    link.rel = 'icon';
                    document.head.appendChild(link);
                }
                link.href = `data:image/svg+xml,${encodedSvg}`;
            }
        }

        // Fire the dynamic favicon generator! 
        setSystemFavicon('terminal-square', '#ff69b4');


        // --- 3. Custom Cursor Logic (Optimized for GPU) ---
        const cursor = document.getElementById('cursor');
        let mouseX = window.innerWidth / 2;
        let mouseY = window.innerHeight / 2;
        let cursorX = mouseX;
        let cursorY = mouseY;
        let isMouseDown = false;

        document.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        document.addEventListener('mousedown', () => isMouseDown = true);
        document.addEventListener('mouseup', () => isMouseDown = false);

        function animateCursor() {
            // Smooth interpolation
            cursorX += (mouseX - cursorX) * 0.25; 
            cursorY += (mouseY - cursorY) * 0.25;
            
            const scale = isMouseDown ? 0.8 : 1;
            // 9 is half the 18px width/height to center the circle on the pointer
            cursor.style.transform = `translate3d(${cursorX - 9}px, ${cursorY - 9}px, 0) scale(${scale})`;
            
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        // --- 4. Loading Animation ---
        const loader = document.getElementById('loader');
        const mainContent = document.getElementById('main-content');
        const frames = ['/', '-', '\\', '|'];
        let frameIdx = 0;

        const loadingInterval = setInterval(() => {
            loader.innerText = `BOOTING SYSTEM... ${frames[frameIdx]}`;
            frameIdx = (frameIdx + 1) % frames.length;
        }, 150);

        setTimeout(() => {
            clearInterval(loadingInterval);
            loader.style.display = 'none';
            mainContent.style.display = 'flex';
        }, 2000);

        // --- 5. Simple Markdown Parser ---
        function parseMarkdown(text) {
            return text
                // Headers
                .replace(/^### (.*$)/gim, '<h3>$1</h3>')
                .replace(/^## (.*$)/gim, '<h2>$1</h2>')
                .replace(/^# (.*$)/gim, '<h1>$1</h1>')
                // Bold and Italic
                .replace(/\*\*(.*)\*\*/gim, '<strong>$1</strong>')
                .replace(/\*(.*)\*/gim, '<em>$1</em>')
                // Line breaks
                .replace(/\n\n/gim, '<br><br>')
                .replace(/\n- (.*)/gim, '<br>• $1');
        }

        // --- 6. Fetch License Logic ---
        async function loadText(filepath, btnElement) {
            const viewer = document.getElementById('license-text');
            const clickSound = document.getElementById('click-sound');
            
            // Handle Active Button UI
            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            if (btnElement) btnElement.classList.add('active');

            // Play sound safely
            if (clickSound) {
                clickSound.currentTime = 0;
                const playPromise = clickSound.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => { /* Ignore auto-play blocking errors silently */ });
                }
            }

            viewer.innerHTML = `<em>FETCHING DATA FROM ${filepath}...</em>`;

            try {
                const response = await fetch(filepath);
                if (!response.ok) throw new Error('File not found or access denied.');
                const text = await response.text();
                
                setTimeout(() => {
                    viewer.innerHTML = parseMarkdown(text);
                }, 200);

            } catch (error) {
                viewer.innerHTML = `<strong>[ERROR 404]:</strong> UNABLE TO LOCATE DIRECTORY \\${filepath}<br><br>Check if the file paths exist in your project structure.`;
            }
        }
    </script>
</body>
</html>
