<!DOCTYPE html>
<html lang="en">
<head>
    <script src="../assets/js/seo.js"></script>
    <script src="../assets/js/vine-cursor.js" defer></script>
    <script src="../assets/js/icon-engine.js" defer></script>
    <title>HOME</title>
    
    <link rel="icon" type="image/svg+xml" href="../assets/icons/home.svg" />
    <link rel="preload" href="../assets/fonts/homepage/Comfortaa-VariableFont_wght.woff2" as="font" type="font/woff2" crossorigin>

    <link rel="stylesheet" href="../assets/css/fonts.css">
    <style>
        /* --- RESET & BASE --- */
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        /* HIDE DEFAULT CURSOR GLOBALLY */
        html, body, button, a, input {
            cursor: none !important;
        }

        /* --- TEXT SELECTION HIGHLIGHT --- */
        ::selection {
            background: #b8dce8; /* Hydrangea teal */
            color: #2e6b4f;      /* Deep forest green */
            text-shadow: none;
        }
        ::-moz-selection {
            background: #b8dce8;
            color: #2e6b4f;
            text-shadow: none;
        }

        body {
            margin: 0;
            padding: 0;
            background: url('../assets/background/background.gif') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Comfortaa', sans-serif;
            min-height: 100vh;
            min-height: 100dvh; 
            position: relative;
            overflow-x: hidden;
            color: #1d3d2f;
        }



        /* --- ANIMATIONS --- */
        @keyframes float {
            0%, 100% { transform: translate(-50%, -50%); }
            50% { transform: translate(-50%, -53%); } 
        }
        @keyframes softPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 4px 16px rgba(168,213,181,0.35); }
            50% { transform: scale(1.02); box-shadow: 0 8px 24px rgba(168,213,181,0.55); }
        }
        @keyframes headerSwing {
            0% { transform: translateX(-50%) rotate(0deg); }
            25% { transform: translateX(-50%) rotate(0.5deg); }
            75% { transform: translateX(-50%) rotate(-0.5deg); }
            100% { transform: translateX(-50%) rotate(0deg); }
        }
        @keyframes headerFadeIn {
            from { opacity: 0; transform: translate(-50%, -50px); }
            to { opacity: 1; transform: translateX(-50%); }
        }
        @keyframes navFadeIn {
            from { opacity: 0; transform: translate(-50%, -45%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        @keyframes iconWave {
            0% { transform: rotate(0deg); }
            20% { transform: rotate(-25deg); }
            40% { transform: rotate(20deg); }
            60% { transform: rotate(-15deg); }
            80% { transform: rotate(10deg); }
            100% { transform: rotate(0deg); }
        }
        @keyframes curtainSway {
            0% { transform: rotate(0deg); }
            25% { transform: rotate(2deg); }
            75% { transform: rotate(-2deg); }
            100% { transform: rotate(0deg); }
        }

        /* --- HANGING GLASS HEADER --- */
        .site-header {
            position: fixed;
            top: 50px; 
            left: 50%;
            transform: translateX(-50%);
            z-index: 2001;
            opacity: 0;
            animation: headerFadeIn 1s cubic-bezier(0.2, 0.8, 0.2, 1) forwards, headerSwing 6s ease-in-out infinite 1s;
            background: rgba(232, 248, 244, 0.30);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px; 
            padding: 15px 45px;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-bottom: 6px solid rgba(168, 213, 181, 0.25); 
            border-right: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 15px 35px rgba(46, 107, 79, 0.12), inset 0 1px 0 rgba(255, 255, 255, 0.6); 
            white-space: nowrap;
            will-change: transform, opacity;
            transform-style: preserve-3d;
        }

        .site-header::before, .site-header::after {
            content: ''; position: absolute; top: -1000px; bottom: 100%; width: 2px;
            background: #3a5a3a; z-index: -1; box-shadow: 1px 0 2px rgba(168,213,181,0.4); 
        }
        .site-header::before { left: 25px; } .site-header::after { right: 25px; }

        .bolt-l, .bolt-r {
            position: absolute; top: 8px; width: 8px; height: 8px;
            background: #3a5a3a; border-radius: 50%; box-shadow: 0 1px 2px rgba(168,213,181,0.9); z-index: 2;
        }
        .bolt-l { left: 22px; } .bolt-r { right: 22px; }

        .site-title {
            font-family: 'Comfortaa', sans-serif;
            color: #1d3d2f; font-size: 2.5rem; margin: 0;
            letter-spacing: 1px; text-shadow: 2px 2px 0px rgba(255,255,255,0.6);
            position: relative; z-index: 2; 
        }

        /* --- MAIN NAVIGATION --- */
        .main-nav {
            position: fixed;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: auto; min-width: 320px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px;
            background: rgba(232, 248, 244, 0.18);
            backdrop-filter: blur(20px) saturate(1.3); -webkit-backdrop-filter: blur(20px) saturate(1.3);
            border-radius: 32px;
            box-shadow: 0 15px 45px rgba(46, 107, 79, 0.12);
            padding: 40px;
            z-index: 2000;
            border: 1px solid rgba(255, 255, 255, 0.35);
            opacity: 0;
            animation: navFadeIn 1s ease-out forwards, float 6s ease-in-out infinite 1s;
            will-change: transform, opacity;
        }

        .main-nav button {
            width: 250px; height: 65px; padding: 0; border: none; border-radius: 20px;
            font-size: 24px; font-weight: 800; cursor: none; 
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow: hidden;
            font-family: 'Nunito', sans-serif;
            color: #1d3d2f;
            background: linear-gradient(135deg, #d4ece0 0%, #e8f5f0 40%, #dce8f5 100%);
            background-size: 200% 200%;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 5px 15px rgba(46, 107, 79, 0.2);
            touch-action: manipulation;
        }
        .main-nav button span { z-index: 2; position: relative; }

        @media (hover: hover) {
            .main-nav button:hover {
                transform: scale(1.05) translateY(-3px);
                background-position: 100% 50%;
                box-shadow: 0 10px 25px rgba(179, 153, 212, 0.45);
                color: #2e4a8a;
                background: linear-gradient(135deg, #c8d8f0 0%, #e0cff5 50%, #f5d5c0 100%);
            }
            .main-nav button:hover::before { left: 100%; }
        }
        .main-nav button:active { transform: scale(0.96); }
        .main-nav button::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.45), transparent);
            transition: 0.5s; z-index: 1;
        }

        /* --- BOTTOM BAR --- */
        .bottom-bar {
            position: fixed; left: 50%; bottom: 25px; transform: translateX(-50%);
            display: flex; align-items: center; gap: 15px;
            background: rgba(232, 248, 244, 0.28);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 20px; padding: 10px 25px;
            z-index: 1000; border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 5px 20px rgba(46,107,79,0.08);
            transition: transform 0.3s ease;
        }
        @media (hover: hover) { .bottom-bar:hover { transform: translateX(-50%) translateY(-3px); } }

        .clock-text {
            font-family: 'Caveat', cursive; font-size: 22px; color: #1d3d2f; font-weight: 700;
            min-width: 90px; text-align: center; cursor: none; user-select: none; transition: transform 0.1s ease;
        }
        .clock-text:active { transform: scale(0.9); color: #2e6b4f; }
        .bar-separator { width: 2px; height: 24px; background: rgba(46,107,79,0.3); border-radius: 5px; }
        .music-label { color: #1d3d2f; font-family: 'Caveat', cursive; font-size: 22px; font-weight: 700; }
        .toggle-btn {
            background: rgba(255,255,255,0.55); border: 1px solid rgba(255,255,255,0.55);
            border-radius: 12px; padding: 6px 12px; cursor: none;
            transition: all 0.3s ease; display: flex; align-items: center; justify-content: center;
        }
        .toggle-btn:active { transform: scale(0.9); }

        /* --- CREDITS BUTTON & MODAL --- */
        .made-with-love {
            position: fixed; right: 20px; bottom: 20px;
            font-family: 'Caveat', cursive; font-size: 1.2rem; color: #2e6b4f;
            background: rgba(232, 248, 244, 0.28);
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 5px 20px rgba(46, 107, 79, 0.08);
            border-radius: 50px; padding: 8px 20px;
            z-index: 1200; display: flex; align-items: center; gap: 10px;
            cursor: none; user-select: none;
            animation: softPulse 4s infinite ease-in-out;
            transition: background 0.3s ease, transform 0.3s ease;
        }

        .credits-btn {
            background: rgba(255, 255, 255, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.65);
            border-radius: 50%; width: 36px; height: 36px;
            display: flex; align-items: center; justify-content: center;
            cursor: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 2px 10px rgba(46, 107, 79, 0.12);
        }

        .credits-btn img { transform-origin: center; will-change: transform; }
        .credits-btn:hover img, .credits-btn:active img { animation: iconWave 0.6s ease-in-out; }

        .made-with-love:hover {
            background: rgba(232, 248, 244, 0.45);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.65);
        }
        
        .credits-modal {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(168, 213, 181, 0.18); 
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            z-index: 20000; display: none; align-items: center; justify-content: center;
            cursor: none; opacity: 0; animation: fadeInModal 0.3s forwards;
        }
        @keyframes fadeInModal { to { opacity: 1; } }

        .credits-modal-content {
            background: rgba(232, 248, 244, 0.50); 
            background-image: linear-gradient(135deg, rgba(255, 255, 255, 0.55) 0%, rgba(196, 220, 245, 0.35) 50%, rgba(245, 213, 192, 0.25) 100%);
            backdrop-filter: blur(20px) saturate(200%); -webkit-backdrop-filter: blur(20px) saturate(200%);
            border: 2px solid rgba(255, 255, 255, 0.75); 
            box-shadow: 0 25px 50px rgba(46, 107, 79, 0.18), inset 0 0 20px rgba(255, 255, 255, 0.45);
            border-radius: 24px; padding: 30px;
            width: 400px; max-width: 90vw; max-height: 85vh;
            position: relative; overflow-y: auto;
            scrollbar-width: thin; scrollbar-color: rgba(46, 107, 79, 0.5) rgba(255, 255, 255, 0.3);
            transform: scale(0.95); animation: popInModal 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            color: #1d3d2f; 
        }
        @keyframes popInModal { to { transform: scale(1); } }

        .credits-modal-content::-webkit-scrollbar { width: 6px; }
        .credits-modal-content::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }
        .credits-modal-content::-webkit-scrollbar-thumb { 
            background-color: rgba(46, 107, 79, 0.5); border-radius: 10px; border: 1px solid rgba(255,255,255,0.4);
        }

        .close-credits {
            position: absolute; top: 15px; right: 20px;
            background: rgba(255,255,255,0.45);
            border-radius: 50%;
            width: 32px; height: 32px;
            border: 1px solid rgba(255,255,255,0.65);
            font-size: 1.5rem; color: #2e6b4f;
            display: flex; align-items: center; justify-content: center;
            cursor: none; 
            transition: all 0.5s cubic-bezier(0.34, 1.56, 0.64, 1); 
            line-height: 1; padding-bottom: 2px;
        }
        .close-credits:hover {
            background: rgba(255,255,255,0.9); border-color: #2e6b4f;
            transform: rotate(90deg) scale(1.1);
        }

        /* --- MARKDOWN STYLING --- */
        .credits-text { font-family: 'Comfortaa', sans-serif; font-weight: 300; font-size: 1rem; line-height: 1.6; }
        .credits-text h1 { color: #2e6b4f; font-size: 1.6rem; margin: 10px 0 10px 0; border-bottom: 2px dashed #a8d5b5; padding-bottom: 5px; font-weight: 700; }
        .credits-text h2 { color: #2e6b4f; font-size: 1.3rem; margin: 20px 0 8px 0; font-weight: 700; }
        .credits-text h3 { color: #2e6b4f; font-size: 1.1rem; margin: 15px 0 5px 0; font-weight: 700; }
        .credits-text h4, .credits-text h5, .credits-text h6 { color: #2e6b4f; margin: 10px 0 5px 0; font-weight: 700; }
        .credits-text p { margin-bottom: 0.8em; margin-top: 0; }
        .credits-text ul { padding-left: 20px; margin-bottom: 10px; }
        .credits-text li { margin-bottom: 4px; }
        .credits-text hr { border: none; border-top: 2px dashed #a8d5b5; margin: 15px 0; opacity: 0.6; }
        .credits-text a { color: #2e6b4f; text-decoration: none; font-weight: 700; transition: 0.2s; border-bottom: 1px solid transparent; cursor: none; }
        .credits-text a:hover { border-bottom: 1px solid #2e6b4f; }
        .credits-text blockquote { background: rgba(255,255,255,0.6); border-left: 4px solid #2e6b4f; padding: 8px 12px; margin: 10px 0; color: #1d3d2f; border-radius: 0 8px 8px 0; font-style: italic; }

        /* --- ROPE AND FLAG OVERLAY --- */
        .rope-container {
            position: fixed; top: 0; right: 10%; z-index: 3000;
            display: flex; flex-direction: column; align-items: center;
            cursor: none; 
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .rope-container:hover { transform: translateY(8px); }
        .rope-container:active { transform: translateY(15px); }
        
        .rope {
            width: 2px; height: 60px;
            background: linear-gradient(to right, #3a5a3a, #6b8f6b, #3a5a3a);
            box-shadow: 1px 0 3px rgba(0,0,0,0.2);
        }
        .rope-handle {
            width: 14px; height: 14px; background: #3a5a3a;
            border-radius: 50%; margin-top: -1px;
            box-shadow: inset -2px -2px 5px rgba(0,0,0,0.4), 0 3px 5px rgba(0,0,0,0.2);
            border: 1px solid #2e4a2e;
        }

        /* --- FLAG OVERLAY --- */
        .flag-overlay {
            position: fixed; inset: 0;
            background: rgba(18, 40, 30, 0.72);
            backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
            z-index: 4000; display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .flag-overlay.flag-visible { opacity: 1; pointer-events: all; }

        .flag-window {
            position: relative;
            width: min(88vw, 920px);
            max-height: 82vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;
            background: linear-gradient(135deg, rgba(232, 248, 244, 0.22), rgba(196, 220, 245, 0.10));
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 24px;
            box-shadow: 0 32px 64px rgba(0,0,0,0.55), inset 0 0 30px rgba(255,255,255,0.1);
            padding: 28px 28px 22px;
            backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px);
            transform: scale(0.92) translateY(20px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .flag-overlay.flag-visible .flag-window { transform: scale(1) translateY(0); }
        .flag-window::before {
            content: ''; position: absolute; top: 12px; left: 12px; right: 12px; bottom: 12px;
            border: 1px dashed rgba(255, 255, 255, 0.22); border-radius: 16px; pointer-events: none;
        }

        /* Flag name label */
        .flag-name {
            font-family: 'Nunito', sans-serif;
            font-size: 1rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
            color: rgba(255,255,255,0.75);
            text-shadow: 0 1px 8px rgba(0,0,0,0.4);
            margin-bottom: 14px;
            z-index: 3;
            transition: opacity 0.3s ease;
            user-select: none;
        }

        /* Image area with prev/next arrows flanking it */
        .flag-img-row {
            display: flex; align-items: center; gap: 14px;
            width: 100%;
            justify-content: center;
        }

        .main-flag {
            flex: 1 1 auto;
            max-width: 100%; max-height: 52vh; object-fit: contain;
            border-radius: 10px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.55), 0 0 0 2px rgba(255,255,255,0.18);
            transition: opacity 0.35s ease, transform 0.35s ease;
            position: relative; z-index: 2;
        }
        .main-flag.flag-fade { opacity: 0; transform: scale(0.97); }

        /* Arrows */
        .arrow-wrapper {
            flex-shrink: 0;
            width: 44px; height: 44px;
            background: rgba(29, 61, 47, 0.45);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.3);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            cursor: none; transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 5;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35);
        }
        .arrow-wrapper:hover { transform: scale(1.12); background: rgba(29, 61, 47, 0.72); border-color: #a8d5b5; }
        .arrow-wrapper:active { transform: scale(0.93); }
        .arrow-inner {
            width: 11px; height: 11px;
            border-top: 2.5px solid rgba(255, 255, 255, 0.92);
            border-right: 2.5px solid rgba(255, 255, 255, 0.92);
            transition: border-color 0.25s;
        }
        .arrow-wrapper:hover .arrow-inner { border-color: #a8d5b5; }
        .arrow-next .arrow-inner { transform: rotate(45deg) translateX(-2px) translateY(2px); }
        .arrow-prev .arrow-inner { transform: rotate(-135deg) translateX(-2px) translateY(2px); }

        /* Dot indicators */
        .flag-dots {
            display: flex; gap: 8px; margin-top: 16px; z-index: 3;
        }
        .flag-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: rgba(255,255,255,0.3);
            border: 1px solid rgba(255,255,255,0.4);
            transition: all 0.3s ease;
            cursor: none;
        }
        .flag-dot.active {
            background: #a8d5b5;
            border-color: #a8d5b5;
            transform: scale(1.3);
        }

        /* Bottom actions row */
        .flag-actions {
            margin-top: 16px; display: flex; align-items: center; gap: 12px; z-index: 10;
            min-height: 44px;
        }

        .meaning-btn {
            padding: 10px 24px;
            background: linear-gradient(135deg, rgba(168, 213, 181, 0.82), rgba(196, 220, 245, 0.82));
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 18px;
            color: #1d3d2f; font-family: 'Nunito', sans-serif;
            text-decoration: none; font-weight: 800; font-size: 0.95rem;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 6px 20px rgba(168, 213, 181, 0.45);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: none;
            text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
        }
        .meaning-btn:hover { 
            background: linear-gradient(135deg, rgba(168, 213, 181, 1), rgba(196, 220, 245, 1));
            transform: translateY(-2px) scale(1.04); 
            box-shadow: 0 10px 28px rgba(168, 213, 181, 0.8);
            border-color: #fff;
        }
        .meaning-btn.hidden { display: none; }

        /* Close button */
        .close-flag {
            position: absolute; top: -18px; right: -18px;
            width: 42px; height: 42px;
            background: rgba(29, 61, 47, 0.50);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.35);
            font-size: 26px; color: white;
            cursor: none; font-family: 'Nunito', sans-serif;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5); transition: all 0.3s;
            z-index: 10; padding-bottom: 3px;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
        }
        .close-flag:hover { transform: scale(1.1) rotate(90deg); color: #a8d5b5; background: rgba(29,61,47,0.75); border-color: #a8d5b5; }

        /* --- MOBILE --- */
        @media (max-width: 600px) {
            .site-title { font-size: 1.8rem; }
            .site-header { padding: 10px 25px; top: 40px; }
            html, body, button, a, input, .clock-text, .toggle-btn, .credits-btn, .close-credits, .rope-container, .close-flag, .arrow-wrapper { cursor: auto !important; }
            #vc-root { display: none !important; }
            .main-nav { padding: 25px 15px; width: 85%; min-width: unset; gap: 15px; }
            .main-nav button { width: 100%; height: 55px; font-size: 20px; }
            .bottom-bar { width: auto; bottom: 20px; padding: 8px 15px; gap: 10px; left: 20px; transform: none; border-radius: 15px; }
            .clock-text { font-size: 18px; min-width: 70px; }
            .music-label { display: none; }
            .made-with-love { right: 20px; bottom: 20px; padding: 6px 12px; font-size: 1rem; border-radius: 30px; }
            .made-with-love span { display: inline; font-size: 0.9rem;}
            
            .rope-container { right: 5%; }
            .rope { height: 40px; }
            .flag-window { width: 90vw; height: 60vh; padding: 15px; }
            .arrow-wrapper { right: -10px; width: 36px; height: 36px; }
            .next-arrow-inner { width: 10px; height: 10px; }
            .close-flag { right: -10px; top: -15px; width: 36px; height: 36px; font-size: 24px; padding-bottom: 2px; }
        }
        @media (max-width: 360px) { .made-with-love span { display: none; } .made-with-love { padding: 5px; border-radius: 50%; } }

        /* ================================================
           🌿  NATURE OVERLAY – CSS plant structures
           ================================================ */
        .nature-frame {
            position: fixed; inset: 0;
            pointer-events: none;
            z-index: 8;          /* above bg gif, below all UI (UI is 100+) */
            overflow: hidden;
        }

        /* Shared primitives */
        .nv  { position: absolute; }

    <script>
        // Hover listeners still used by flag viewer dots
        const addHoverListeners = (el) => {
            if(!el) return;
            // vine-cursor.js handles hover; this is a no-op stub kept for flag-viewer calls
        };

        // --- CLOCK ---
        const updateClock = () => {
            const now = new Date();
            let h = now.getHours() % 12 || 12;
            let m = now.getMinutes().toString().padStart(2,'0');
            let ampm = now.getHours() >= 12 ? 'PM' : 'AM';
            document.getElementById('clock').textContent = `${h}:${m} ${ampm}`;
        };
        setInterval(updateClock, 1000); updateClock();

        // --- MUSIC ---
        const music = document.getElementById('atmos-music');
        const mIconWrapper = document.getElementById('music-icon-wrapper');
        if(music){ music.volume = 0.5; }
        
        document.getElementById('music-toggle').addEventListener('click', () => {
            if(music.paused) {
                music.play().then(() => {
                    if (mIconWrapper) {
                        mIconWrapper.innerHTML = '<i data-lucide="volume-2" style="width:22px;height:22px;color: #db84c0;"></i>';
                        if (typeof lucide !== 'undefined') lucide.createIcons({ root: mIconWrapper });
                    }
                }).catch(() => alert("Interact first!"));
            } else {
                music.pause(); 
                if (mIconWrapper) {
                    mIconWrapper.innerHTML = '<i data-lucide="volume-x" style="width:22px;height:22px;color: #db84c0;"></i>';
                    if (typeof lucide !== 'undefined') lucide.createIcons({ root: mIconWrapper });
                }
            }
        });

        // --- NAVIGATION ---
        ['blogBtn','projectsBtn','aboutBtn'].forEach(id => {
            const btn = document.getElementById(id);
            if(btn) btn.addEventListener('click', () => window.location.href = btn.dataset.target);
        });

        // --- FLAG VIEWER ---
        const FLAGS = [
            { src: '../assets/images/flags/nonbinarytransflag.jpg', name: 'Non-binary Transfem', meaningUrl: 'nonbinary-transfem.html' },
            { src: '../assets/images/flags/lgbtq.jpg',              name: 'Rainbow Pride',       meaningUrl: null }
        ];

        const flagOverlay  = document.getElementById('flagOverlay');
        const flagWindow   = document.getElementById('flagWindow');
        const mainFlagImg  = document.getElementById('mainFlagImg');
        const flagName     = document.getElementById('flagName');
        const flagDots     = document.getElementById('flagDots');
        const meaningBtn   = document.getElementById('meaningBtn');
        const closeFlag    = document.getElementById('closeFlag');
        const nextFlagBtn  = document.getElementById('nextFlagBtn');
        const prevFlagBtn  = document.getElementById('prevFlagBtn');
        const clockTrigger = document.getElementById('clock');
        const ropePull     = document.getElementById('ropePull');

        let currentFlag = 0;

        // Build dots
        FLAGS.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = 'flag-dot' + (i === 0 ? ' active' : '');
            dot.dataset.index = i;
            dot.addEventListener('click', () => goToFlag(i));
            flagDots.appendChild(dot);
        });

        function updateDots() {
            flagDots.querySelectorAll('.flag-dot').forEach((d, i) =>
                d.classList.toggle('active', i === currentFlag));
        }

        function goToFlag(index, dir = 1) {
            if (index === currentFlag) return;
            mainFlagImg.classList.add('flag-fade');
            flagName.style.opacity = '0';
            setTimeout(() => {
                currentFlag = (index + FLAGS.length) % FLAGS.length;
                const f = FLAGS[currentFlag];
                mainFlagImg.src = f.src;
                mainFlagImg.alt = f.name;
                flagName.textContent = f.name;
                if (f.meaningUrl) {
                    meaningBtn.href = f.meaningUrl;
                    meaningBtn.classList.remove('hidden');
                } else {
                    meaningBtn.classList.add('hidden');
                }
                updateDots();
                mainFlagImg.classList.remove('flag-fade');
                flagName.style.opacity = '1';
            }, 350);
        }

        const openFlags  = () => flagOverlay.classList.add('flag-visible');
        const closeFlags = () => flagOverlay.classList.remove('flag-visible');

        clockTrigger.addEventListener('click', () => flagOverlay.classList.contains('flag-visible') ? closeFlags() : openFlags());
        ropePull.addEventListener('click',     () => flagOverlay.classList.contains('flag-visible') ? closeFlags() : openFlags());
        closeFlag.addEventListener('click', closeFlags);
        flagOverlay.addEventListener('click', e => { if (e.target === flagOverlay) closeFlags(); });

        nextFlagBtn.addEventListener('click', () => goToFlag(currentFlag + 1,  1));
        prevFlagBtn.addEventListener('click', () => goToFlag(currentFlag - 1, -1));

        document.addEventListener('keydown', e => {
            if (!flagOverlay.classList.contains('flag-visible')) return;
            if (e.key === 'ArrowRight') goToFlag(currentFlag + 1,  1);
            if (e.key === 'ArrowLeft')  goToFlag(currentFlag - 1, -1);
            if (e.key === 'Escape')     closeFlags();
        });

        [closeFlag, nextFlagBtn, prevFlagBtn, meaningBtn].forEach(addHoverListeners);
        flagDots.querySelectorAll('.flag-dot').forEach(addHoverListeners);

        // --- IMPROVED MARKDOWN PARSER ---
        function parseMarkdown(text) {
            let lines = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").split('\n');
            let html = '';
            let inList = false;

            const parseInline = (str) => {
                return str
                    .replace(/\*\*\*(.*?)\*\*\*/g, '<b><i>$1</i></b>')
                    .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')
                    .replace(/\*(.*?)\*/g, '<i>$1</i>')
                    .replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1" style="max-width:100%;border-radius:8px;">')
                    .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');
            };

            lines.forEach(line => {
                let str = line.trim();

                if (str === '---' || str === '***' || str === '___') {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += '<hr>';
                    return;
                }

                const headerMatch = str.match(/^(#{1,6})\s+(.*)/);
                if (headerMatch) {
                    if (inList) { html += '</ul>'; inList = false; }
                    const level = headerMatch[1].length;
                    html += `<h${level}>${parseInline(headerMatch[2])}</h${level}>`;
                    return;
                }

                if (str.startsWith('- ') || str.startsWith('* ')) {
                    if (!inList) { html += '<ul>'; inList = true; }
                    html += `<li>${parseInline(str.substring(2))}</li>`;
                    return;
                }

                if (inList && str !== "") {
                    html += '</ul>';
                    inList = false;
                }

                if (str.startsWith('> ')) {
                    if (inList) { html += '</ul>'; inList = false; }
                    html += `<blockquote>${parseInline(str.substring(2))}</blockquote>`;
                    return;
                }

                if (str) {
                    html += `<p>${parseInline(str)}</p>`;
                }
            });

            if (inList) html += '</ul>';
            return html;
        }

        // --- CREDITS MODAL ---
        const modal = document.getElementById('creditsModal');
        const txt = document.getElementById('creditsText');
        const creditsBtn = document.getElementById('creditsBtn');
        const closeCredits = document.getElementById('closeCredits');
        
        addHoverListeners(creditsBtn);
        addHoverListeners(closeCredits);

        creditsBtn.addEventListener('click', () => {
            modal.style.display = 'flex';
            txt.innerHTML = '<div style="text-align:center;color:#2e6b4f;">Loading...</div>';
            
            fetch('../texts/credits.md')
                .then(r => r.ok ? r.text() : Promise.reject())
                .then(t => {
                    txt.innerHTML = parseMarkdown(t);
                    txt.querySelectorAll('a').forEach(addHoverListeners);
                })
                .catch(() => txt.innerHTML = "<h3>Credits</h3><p><b>Created by Crossie</b></p><p>(File not found)</p>");
        });

        const closeModal = () => modal.style.display = 'none';
        closeCredits.addEventListener('click', closeModal);
        modal.addEventListener('click', e => { if(e.target === modal) closeModal(); });

        // --- FLOATING LEAF PARTICLES ---
        const LEAF_COLS = ['#2a5c38','#3d7a4a','#52a062','#6bc07a',
                           'rgba(123,184,224,.7)','rgba(179,153,212,.7)'];
        function spawnLeaf() {
            const leaf = document.createElement('div');
            leaf.className = 'float-leaf';
            const w = 9 + Math.random() * 18;
            const startX  = Math.random() * window.innerWidth;
            const driftX  = (Math.random() - 0.5) * 220;
            const dur     = 8 + Math.random() * 9;
            const color   = LEAF_COLS[Math.floor(Math.random() * LEAF_COLS.length)];
            const rotS    = Math.random() * 360;
            const rotE    = rotS + (Math.random() > .5 ? 1 : -1) * (160 + Math.random() * 200);
            leaf.style.cssText = [
                `width:${w}px`, `height:${(w * .68)|0}px`,
                `left:${startX}px`, `top:-30px`,
                `background:${color}`,
                `--ld:${dur}s`, `--lx:${driftX}px`,
                `--lr:${rotS}deg`, `--le:${rotE}deg`
            ].join(';');
            document.body.appendChild(leaf);
            setTimeout(() => leaf.remove(), (dur + .6) * 1000);
        }
        // Staggered initial burst then ongoing rain
        [800, 1800, 3000, 4500].forEach(t => setTimeout(spawnLeaf, t));
        setInterval(() => spawnLeaf(), 2800 + Math.random() * 2200);
    </script>
</body>
