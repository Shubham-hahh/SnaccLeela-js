name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true # Crucial for your game assets/images

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Ensure .nojekyll exists
        run: touch .nojekyll # Prevents GitHub from ignoring folders with underscores

      - name: Debug File Structure
        run: |
          echo "Checking files before upload..."
          ls -R

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Mirrors your local repository root

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
