name: Deploy static content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true # Fetches actual files if you use Git LFS for images

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # FIX: Prevents GitHub from hiding folders starting with underscores (e.g. _images)
      - name: Bypass Jekyll
        run: touch .nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Uploads your entire repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
