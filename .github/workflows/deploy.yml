name: Deploy Multi-Project Quartz

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Hazelbite
        run: |
          cd "pages/Hazelbite"
          npm install
          npx quartz build

      - name: Build Project-Cannon
        run: |
          cd "pages/Project-Cannon"
          npm install
          npx quartz build

     - name: Merge Everything
        run: |
          # 1. Create a clean deployment folder
          mkdir -p _site
          
          # 2. Copy the FULL repository structure into _site
          # We use rsync to exclude technical folders we don't want on the web
          rsync -a . _site/ --exclude .git --exclude .github --exclude node_modules --exclude pages/Hazelbite --exclude pages/Project-Cannon
          
          # 3. Create the specific subfolders for your Quartz sites
          mkdir -p _site/pages/Hazelbite
          mkdir -p _site/pages/Project-Cannon
          
          # 4. Copy the BUILT Quartz files into those subfolders
          # This overwrites the "source code" folders with the "ready-to-view" folders
          cp -r pages/Hazelbite/public/* _site/pages/Hazelbite/
          cp -r pages/Project-Cannon/public/* _site/pages/Project-Cannon/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5