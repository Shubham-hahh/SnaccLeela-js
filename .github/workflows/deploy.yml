# deploy.yml (Optimized for Smart Linking)
name: Deploy Full Repo with Quartz

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Configuration for each sub-site
        include:
          - folder: "pages/Hazelbite"
            slug: "hazelbite"
          - folder: "pages/Project-Cannon"
            slug: "cannon"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Sub-Project
        run: |
          cd "${{ matrix.folder }}"
          npm install
          
          # AUTO-FIX: Force Quartz to use the correct absolute path for assets
          # This fixes the "broken CSS/JS" issue on sub-pages
          sed -i 's|baseUrl: ".*"|baseUrl: "${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ matrix.slug }}"|g' quartz.config.ts
          
          npx quartz build --output "../../public-${{ matrix.slug }}"

      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.slug }}
          path: public-${{ matrix.slug }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Assemble Final Site
        run: |
          mkdir -p _site
          
          # 1. Copy root files (landing page, global assets)
          rsync -a . _site/ --exclude .git --exclude .github --exclude node_modules --exclude pages --exclude builds
          
          # 2. Map sub-projects to clean, smart URLs
          # Use 'cp -a' to preserve structure
          mkdir -p _site/hazelbite _site/cannon
          cp -a builds/build-hazelbite/* _site/hazelbite/
          cp -a builds/build-cannon/* _site/cannon/

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy
        uses: actions/deploy-pages@v5