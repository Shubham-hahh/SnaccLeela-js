name: Deploy Hazelbite and Project Cannon

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # --- BUILD HAZELBITE ---
      - name: Install & Build Hazelbite
        run: |
          cd "pages/Hazelbite"
          npm install
          npx quartz build

      # --- BUILD PROJECT CANNON ---
      - name: Install & Build Project Cannon
        run: |
          cd "pages/Project Cannon"
          npm install
          npx quartz build

      # --- ORGANIZE FOR DEPLOYMENT ---
      - name: Prepare Staging Area
        run: |
          mkdir -p staging/pages/Hazelbite
          mkdir -p "staging/pages/Project Cannon"
          cp -r pages/Hazelbite/public/* staging/pages/Hazelbite/
          cp -r "pages/Project Cannon/public/"* "staging/pages/Project Cannon/"
          # If you have an index.html at the root of SnaccLeela-js, copy it too:
          if [ -f index.html ]; then cp index.html staging/; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'staging'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5