name: Deploy Full Repo with Quartz

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-sites:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Define your project folders and their intended URL paths
        include:
          - folder: "pages/Hazelbite"
            slug: "hazelbite"
          - folder: "pages/Project-Cannon"
            slug: "cannon"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: ${{ matrix.folder }}/package-lock.json

      - name: Build Quartz Site
        run: |
          cd "${{ matrix.folder }}"
          npm install
          
          # SMART LINKING FIX: Inject the subpath into the config
          # This ensures that even hardcoded "/" links resolve to the subfolder.
          if [ -f "quartz.config.ts" ]; then
            sed -i "s|baseUrl: \".*\"|baseUrl: \"${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ matrix.slug }}\"|g" quartz.config.ts
          fi
          
          npx quartz build --output "../../public-${{ matrix.slug }}"

      - name: Upload Intermediate Build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.slug }}
          path: public-${{ matrix.slug }}

  deploy:
    needs: build-sites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download All Builds
        uses: actions/download-artifact@v4
        with:
          path: builds

      - name: Merge Everything
        run: |
          mkdir -p _site
          
          # 1. Copy static root files (index.html, assets, etc. from main repo)
          # We exclude the 'pages' source folder to keep the deployment clean
          rsync -a . _site/ --exclude .git --exclude .github --exclude node_modules --exclude pages --exclude builds
          
          # 2. Map builds to clean URLs (e.g., yoursite.com/hazelbite)
          mkdir -p _site/hazelbite
          cp -r builds/build-hazelbite/* _site/hazelbite/
          
          mkdir -p _site/cannon
          cp -r builds/build-cannon/* _site/cannon/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5