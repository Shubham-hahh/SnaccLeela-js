name: Deploy Multi-Project Quartz

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Hazelbite
        run: |
          cd "pages/Hazelbite"
          npm install
          npx quartz build

      - name: Build Project-Cannon
        run: |
          cd "pages/Project-Cannon"
          npm install
          npx quartz build

      - name: Merge Sites
        run: |
          # Create the final directory structure
          mkdir -p _site/pages/Hazelbite
          mkdir -p _site/pages/Project-Cannon
          
          # Copy contents of the public folders into the final structure
          cp -r pages/Hazelbite/public/* _site/pages/Hazelbite/
          cp -r pages/Project-Cannon/public/* _site/pages/Project-Cannon/
          
          # Create a root index if one doesn't exist so the main URL isn't a 404
          if [ ! -f _site/index.html ]; then
            echo "<html><body><h1>CuteSense Studios</h1><ul><li><a href='./pages/Hazelbite/'>Hazelbite</a></li><li><a href='./pages/Project-Cannon/'>Project-Cannon</a></li></ul></body></html>" > _site/index.html
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5