name: Deploy Multi-Project Quartz

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Hazelbite
        run: |
          cd "pages/Hazelbite"
          npm install
          npx quartz build

      - name: Build Project-Cannon
        run: |
          cd "pages/Project-Cannon"
          npm install
          npx quartz build

      - name: Merge Sites
        run: |
          mkdir -p _site/pages/Hazelbite
          mkdir -p _site/pages/Project-Cannon
          
          # Copy your Quartz builds
          cp -r pages/Hazelbite/public/* _site/pages/Hazelbite/
          cp -r pages/Project-Cannon/public/* _site/pages/Project-Cannon/
          
          # POINT TO YOUR MAIN index.html
          # This copies the index.html from your root folder into the deployment
          cp index.html _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5