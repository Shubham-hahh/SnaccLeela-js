name: Deploy Full Repo with Quartz

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Hazelbite
        run: |
          cd "pages/Hazelbite"
          npm install
          npx quartz build

      - name: Build Project-Cannon
        run: |
          cd "pages/Project-Cannon"
          npm install
          npx quartz build

      - name: Merge Everything
        run: |
          # 1. Create the base deployment folder
          mkdir -p _site
          
          # 2. Copy main repo files to root (excluding source and tech folders)
          rsync -a . _site/ --exclude .git --exclude .github --exclude node_modules 
          
          # 3. Create the nested path: /pages/public/
          mkdir -p _site/pages/public/Hazelbite
          mkdir -p _site/pages/public/Project-Cannon
          
          # 4. Copy the BUILT Quartz files into those specific folders
          cp -r pages/Hazelbite/public/* _site/pages/public/Hazelbite/
          cp -r pages/Project-Cannon/public/* _site/pages/public/Project-Cannon/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5