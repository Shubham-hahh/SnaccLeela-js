name: Deploy Multi-Project Quartz

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 1. Build Hazelbite
      - name: Build Hazelbite
        run: |
          cd "pages/Hazelbite"
          npm install
          npx quartz build

      # 2. Build Project Cannon
      - name: Build Project Cannon
        run: |
          cd "pages/Project Cannon"
          npm install
          npx quartz build

      # 3. Create the Final Website Structure
      - name: Merge Sites
        run: |
          mkdir -p _site/pages/Hazelbite
          mkdir -p "_site/pages/Project Cannon"
          
          # Copy built files into the final structure
          cp -r pages/Hazelbite/public/* _site/pages/Hazelbite/
          cp -r "pages/Project Cannon/public/"* "_site/pages/Project Cannon/"
          
          # If you have a main index.html or CSS at the root, copy it here
          if [ -f index.html ]; then cp index.html _site/; fi
          if [ -d assets ]; then cp -r assets _site/; fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5